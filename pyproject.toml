[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memstrata"
version = "0.1.0"
description = "Stratified visual memory for controllable long-video generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy",
  "pillow",
]

[project.optional-dependencies]
# Test-time dependencies. The base install stays light (numpy + pillow); the
# shipped unit suite exercises the mask-quality (scipy) and jitter (OpenCV)
# skills, so `pip install -e ".[dev]"` pulls those in to run the full suite.
dev = [
  "pytest>=8",
  "opencv-python-headless",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/memstrata"]
