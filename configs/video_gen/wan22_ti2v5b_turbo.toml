# Wan2.2-TI2V-5B-Turbo — 4-step, CFG-free, Self-Forcing distilled text+image-to-video.
#
# Selected via provider = "wan22_turbo" (see wan22_turbo_backend.py). Measured on an A800:
# 4-step denoise at 480x832/81f costs ~7.5s, while loading the weights costs ~5 min (base 5B
# shards + the 19.9 GB model.pt + T5 + VAE off shared storage), hence the persistent server.
#
# WHY A VENDORED REPO: the published checkpoint is a bare distilled DiT with native Wan key
# naming (FSDP-wrapped training keys, no VAE/T5/scheduler). It is not loadable by the diffusers
# or LightX2V backends; it only runs under its upstream Self-Forcing pipeline, vendored at
# models/vendor/wan22_ti2v5b_turbo (base weights reached through that repo's wan_models/
# symlinks, which is why the server chdir()s into it).
#
# ROUTES: TI2V is natively text+image conditioned, so this one resident model covers all of
# MemStrata's routes -- composed keyframe (i2v), scene continuation (i2v from last frame), and
# no-visual-memory (t2v, which doubles as the generator-floor control row).

[models.wan22_ti2v5b_turbo]
enabled = true
task = "video_generation"
provider = "wan22_turbo"
family = "wan_ti2v"

# The vendored upstream checkout (pipeline + wan/wan22 modules + wan_models/ symlinks).
repo = "${WAN22_TURBO_REPO}"
# Dir holding the distilled model.pt (DiT only; base 5B is resolved through repo/wan_models/).
model = "${PUBLIC_MODELS_ROOT}/Wan-AI/Wan2.2-TI2V-5B-Turbo"
model_name = "ti2v-5B-turbo-4step"
# Upstream 4-step schedule: denoising_step_list [1000,750,500,250] + warp_denoising_step.
config_path = "configs/inference/wan22.yaml"

# The vace env already satisfies every requirement (torch 2.5.1+cu124, flash_attn 2.8.3,
# diffusers, omegaconf, easydict, ftfy, av, cv2), so no new env and no pip installs: upstream's
# training-only deps (lmdb/decord/pandas) are import-guarded in the vendored copy instead.
python = "python3"

capabilities = ["text_to_video", "image_to_video"]

# 480p landscape, pinned so every segment is the same size and stitching is safe.
height = 480
width = 832
# 121 frames @ 24fps ~= 5.0s, matching the Wan2.1 baselines' 81f @ 16fps ~= 5.1s beat. Frame
# COUNT deliberately differs because the two model families have different native fps; matching
# duration keeps the amount of story per segment comparable. Must be 4k+1.
num_frames = 121
fps = 24
base_seed = 2026

# Persistent server (weights stay resident across segments).
serve_persistent = true
server_job_timeout = 1800
server_ready_timeout = 1800
server_idle_timeout = 1800
auto_pick_gpu = true
min_free_mib = 40000          # measured ~29 GiB resident at 480x832/81f

ffmpeg = "ffmpeg"
