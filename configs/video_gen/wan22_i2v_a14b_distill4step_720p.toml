# 720p variant of wan22_i2v_a14b_distill4step (native_wan), used ONLY for a fair same-resolution
# speed A/B against the LightX2V engine (wan22_i2v_a14b_lightx2v_4step, which runs 1280x720). Same
# distilled experts + native generate.py; only height/width bumped to 720p. Not the production
# default (that stays wan22_i2v_a14b_distill4step @ 480p unless you decide otherwise).

[models.wan22_i2v_a14b_distill4step_720p]
enabled = true
task = "video_generation"
provider = "native_wan"
family = "wan_i2v_svi"
model = "${PUBLIC_MODELS_ROOT}/Wan-AI/Wan2.2-I2V-A14B-distill4step-native"
model_name = "i2v-A14B"
python = "python3"
code_root = "${WAN_CODE_ROOT}"
capabilities = ["image_to_video", "reference_conditioned_continuation"]
serve_persistent = false

height = 720
width = 1280
frame_num = 81
fps = 16

sample_steps = 4
sample_shift = 5.0
sample_guide_scale = 1.0

offload_model = false
t5_cpu = false
convert_model_dtype = true
