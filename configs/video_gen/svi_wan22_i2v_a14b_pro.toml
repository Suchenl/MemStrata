# Stable Video Infinity 2.0 Pro LoRA on Wan2.2-I2V-A14B.

[models.svi_wan22_i2v_a14b_pro]
enabled = true
task = "video_generation"
provider = "native_wan"
family = "wan_i2v_svi"
model = "${PUBLIC_MODELS_ROOT}/Wan-AI/Wan2.2-I2V-A14B"
model_name = "i2v-A14B"
python = "python3"
code_root = "submodules/_2_generation/backends/frames-to-video"
low_noise_lora_weights_path = "${PUBLIC_MODELS_ROOT}/Wan-AI/LoRAs/epfl-vita/svi-model/version-2.0/SVI_Wan2.2-I2V-A14B_low_noise_lora_v2.0_pro.safetensors"
high_noise_lora_weights_path = "${PUBLIC_MODELS_ROOT}/Wan-AI/LoRAs/epfl-vita/svi-model/version-2.0/SVI_Wan2.2-I2V-A14B_high_noise_lora_v2.0_pro.safetensors"
capabilities = ["image_to_video", "reference_conditioned_continuation"]
height = 480
width = 832
frame_num = 81
fps = 16
sample_steps = 40
sample_shift = 12.0
sample_guide_scale = 5.0
offload_model = true
t5_cpu = true
convert_model_dtype = true
lora_rank = 128
lora_alpha = 80
serve_persistent = false
