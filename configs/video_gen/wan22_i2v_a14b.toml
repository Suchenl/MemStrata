# Wan2.2-I2V-A14B official Image-to-Video generation model.

[models.wan22_i2v_a14b]
enabled = true
task = "video_generation"
provider = "native_wan"
family = "wan_i2v"
model = "${PUBLIC_MODELS_ROOT}/Wan-AI/Wan2.2-I2V-A14B"
model_name = "i2v-A14B"
python = "python3"
code_root = "experiments/results/probe/wan22_ti2v5b_official/Wan2.2"
capabilities = ["image_to_video", "reference_conditioned_continuation"]
height = 480
width = 832
frame_num = 81
fps = 16
sample_steps = 40
sample_shift = 5.0
sample_guide_scale = 5.0
offload_model = true
t5_cpu = true
convert_model_dtype = true
