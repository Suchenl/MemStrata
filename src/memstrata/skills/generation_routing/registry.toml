title_zh = "生成路径路由"
description_zh = "生成路径路由（角色 R2b）：按 prompt + 意图 + 上段末帧现有实体，判断下一段视频怎么起——continue_ar（Helios 从前段视频窗 video=[风格锚帧+约73最近帧] 续接，history_sizes=[16,2,1]）/ reanchor_lastframe（末帧当首帧 image=+新 prompt）/ recompose_partial（把回归实体 crop 贴上末帧再 i2v）/ recompose_keyframe（R3→R4→FLUX 从记忆重建首帧）。规则层先圈可行模式（无前段/切镜→只能 recompose），MLLM 在可行集里判并回验。continue_ar 必须走 video=（不是 image=末帧），因 image/video 互斥且单末帧接不住时序。"
title_en = "Generation-Path Routing"
description_en = "Generation-path router (role R2b): from prompt + intent + which referenced entities are on the previous segment's last frame, decide how to seed the next segment — continue_ar (Helios continues from the prior video window video=[style_anchor + ~73 recent frames], history_sizes=[16,2,1]) / reanchor_lastframe (prev last frame as i2v anchor + new prompt) / recompose_partial (paste a returning crop onto the last frame, then i2v) / recompose_keyframe (R3→R4→FLUX fresh keyframe from memory). A deterministic rule layer restricts the feasible modes (no prior segment / scene cut ⇒ recompose only); the MLLM picks among them and is re-validated. continue_ar MUST use video= (not image=<last frame>): image/video are mutually exclusive and a single last frame cannot preserve motion continuity."
